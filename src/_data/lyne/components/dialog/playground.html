<sbb-action-group orientation="vertical" align-group="stretch" horizontal-from="unset" button-size="m">
    <sbb-secondary-button class="dialogtrigger" vairant="secondary" type="button">mit Action-Group</sbb-secondary-button>
    <sbb-secondary-button class="dialogtrigger" vairant="secondary" type="button">ohne Action-Group</sbb-secondary-button>
    <sbb-secondary-button class="dialogtrigger" vairant="secondary" type="button">mit Action-Group und Close-Action</sbb-secondary-button>
</sbb-action-group>
<sbb-dialog id="dialog-1">
    <sbb-dialog-title class="dialog-title" back-button="false">Title</sbb-dialog-title><sbb-dialog-content>
        <p style="min-width: 504px;">Dialog content</p>
    </sbb-dialog-content>
    <sbb-dialog-actions class="sbb-orientation-vertical-full-width sbb-orientation-horizontal-from-small" style="justify-content: space-between;">
        <sbb-secondary-button sbb-dialog-close="">Cancel</sbb-secondary-button>
        <sbb-button variant="primary" sbb-dialog-close="">Confirm</sbb-button>
    </sbb-dialog-actions>
</sbb-dialog>
<sbb-dialog id="dialog-2">
    <sbb-dialog-title class="dialog-title" back-button="false">Title</sbb-dialog-title>
    <sbb-dialog-close-button></sbb-dialog-close-button>
    <sbb-dialog-content>
        <p style="min-width: 504px;">Dialog content</p>
    </sbb-dialog-content>
</sbb-dialog>
<sbb-dialog id="dialog-3">
    <sbb-dialog-title class="dialog-title" back-button="false">Title</sbb-dialog-title>
    <sbb-dialog-content>
        <p style="min-width: 504px;">Dialog content</p>
    </sbb-dialog-content>
    <sbb-dialog-actions class="sbb-orientation-vertical-full-width sbb-orientation-horizontal-from-small" style="justify-content: space-between;">
        <sbb-secondary-button sbb-dialog-close="">Cancel</sbb-secondary-button>
        <sbb-button variant="primary" sbb-dialog-close="">Confirm</sbb-button>
    </sbb-dialog-actions>
</sbb-dialog>

<script>
// In eine Funktion gekapselt, damit keine globalen Namen (z. B. "buttons") mit anderen Skripten kollidieren
(() => {
    const buttons = document.querySelectorAll(".dialogtrigger");
    function buttonClicked(index) {
        const dialog = document.getElementById("dialog-"+(index + 1));
        console.log(dialog.id);
        dialog.open(event);
    }
    buttons.forEach((button, index) => {
    button.addEventListener("click", () => buttonClicked(index));
    });
})();
</script>
