tcp_nopush          on;
tcp_nodelay         on;
types_hash_max_size 2048;

map_hash_bucket_size 256;

gzip on; 
gzip_vary on; 
gzip_min_length 1024; 
gzip_proxied expired no-cache no-store private auth; 
gzip_static on;
gzip_types
  application/atom+xml
  application/geo+json
  application/javascript
  application/x-javascript
  application/json
  application/ld+json
  application/manifest+json
  application/rdf+xml
  application/rss+xml
  application/xhtml+xml
  application/xml
  font/eot
  font/otf
  font/ttf
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;
gzip_disable "MSIE [1-6]\.";

# Caching: JS/CSS mit Content-Hash (?v=…, gesetzt vom Eleventy-Filter assetHash) sind
# unveränderlich und dürfen ein Jahr gecacht werden. Ohne Hash nur einen Tag.
# Medien haben keinen Hash und werden 7 Tage gecacht. HTML wird bei jedem Aufruf
# revalidiert (ETag/Last-Modified), damit neue Deployments sofort sichtbar sind.
map $arg_v $script_style_cache_control {
  ""      "public, max-age=86400";
  default "public, max-age=31536000, immutable";
}

map $uri $cache_control {
  default                                                       "no-cache";
  ~*\.(?:js|mjs|css)$                                           $script_style_cache_control;
  ~*\.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|mp4|webm|pdf)$  "public, max-age=604800";
}

# Spracherkennung für die Startseite: bevorzugte Sprache (erster Eintrag im Accept-Language-Header)
# bestimmt die Weiterleitung von / auf /de/, /fr/, /it/ oder /en/. Fallback ist Deutsch.
map $http_accept_language $root_lang {
  default   de;
  ~*^\s*fr  fr;
  ~*^\s*it  it;
  ~*^\s*en  en;
}

# Die Weiterleitung von / hängt von Accept-Language ab; Caches müssen das berücksichtigen.
map $uri $vary_accept_language {
  default "";
  /       "Accept-Language";
}

map $request_uri $new_uri {
  default "";
  include /usr/share/nginx/html/redirects.txt;
}

server {
  listen       8080 default_server;
  server_name  _;
  root         /usr/share/nginx/html;
  index index.html index.htm;

  if ($http_host = "digital-alias.app.sbb.ch") {
    return 301 $scheme://digital.sbb.ch$request_uri;
  }

  if ($new_uri) {
    rewrite ^ $new_uri permanent;
  }

  rewrite ^([^.]*[^/])$ $1/ permanent;
  port_in_redirect off;
  autoindex off;
  error_page 404 /error/index.html;

  # Prevents MIME type sniffing from browsers (Recommended by Cyber@SBB)
  # https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Content-Type-Options
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cache-Control $cache_control always;

  # Security-Header (Mozilla HTTP Observatory)
  # HSTS: ein Jahr, bewusst ohne includeSubDomains/preload (gilt nur für digital.sbb.ch).
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # SAMEORIGIN statt DENY: die Template- und Theme-Vorschauen betten eigene Seiten per iframe ein.
  add_header X-Frame-Options "SAMEORIGIN" always;
  # allow-popups: Fenster, die von hier geöffnet werden (target="_blank", OneTrust), bleiben funktionsfähig.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Content Security Policy, vorerst nur Report-Only: Verstösse erscheinen in der Browser-Konsole,
  # blockiert wird nichts. Nach einer Beobachtungsphase in "Content-Security-Policy" umbenennen.
  # - 'unsafe-inline' bei style-src: Lyne liefert per SSR viele <style>-Blöcke im Shadow DOM aus.
  # - 'unsafe-inline' bei script-src: OptanonWrapper, hljs.highlightAll() und einzelne Seitenskripte.
  # - cookielaw.org / onetrust.com: Cookie-Banner (OneTrust); icons.app.sbb.ch: Lyne lädt Icons per fetch.
  # - lyne-elements.app.sbb.ch: Storybook-Beispiele in den Demo-Tabs.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.cookielaw.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://icons.app.sbb.ch https://cdn.img.sbb.ch https://cdn.cookielaw.org; font-src 'self' https://cdn.app.sbb.ch; connect-src 'self' https://icons.app.sbb.ch https://cdn.cookielaw.org https://geolocation.onetrust.com; frame-src 'self' https://lyne-elements.app.sbb.ch; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # Leere Werte setzt nginx nicht; Vary erscheint also nur auf /.
  add_header Vary $vary_accept_language;

  # 302 statt 301, weil das Ziel vom Besucher abhängt. Relativer Location-Header, damit hinter
  # dem TLS-Proxy kein http:// entsteht.
  location = / {
    absolute_redirect off;
    return 302 /$root_lang/;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}